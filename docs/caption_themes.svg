<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 130" width="100%" height="100%">
  <defs>
    <linearGradient id="themeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="130" rx="14" fill="url(#themeBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Theme 1: Professional -->
  <g transform="translate(30, 20)">
    <rect width="240" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#94a3b8">THEME: PROFESSIONAL</text>
    <rect x="25" y="42" width="190" height="32" rx="4" fill="#000000" opacity="0.6"/>
    <text x="120" y="63" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">CLEAN · POLISHED · CRISP</text>
  </g>

  <!-- Theme 2: Yellow Pop -->
  <g transform="translate(295, 20)">
    <rect width="240" height="90" rx="10" fill="#1e293b" stroke="#ca8a04" stroke-width="1"/>
    <text x="15" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#eab308">THEME: YELLOW POP</text>
    <rect x="25" y="42" width="190" height="32" rx="4" fill="#000000" opacity="0.8"/>
    <text x="120" y="63" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="15" fill="#facc15" text-anchor="middle" stroke="#000" stroke-width="0.5">HIGH-CONTRAST IMPACT</text>
  </g>

  <!-- Theme 3: Minimal -->
  <g transform="translate(560, 20)">
    <rect width="240" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="15" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#94a3b8">THEME: MINIMAL</text>
    <text x="120" y="63" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#f1f5f9" text-anchor="middle">Subtle, cinematic captioning</text>
  </g>

  <!-- Theme 4: Karaoke -->
  <g transform="translate(825, 20)">
    <rect width="245" height="90" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
    <text x="15" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#f472b6">THEME: KARAOKE GLOW</text>
    <rect x="25" y="42" width="195" height="32" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="122" y="63" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">🔥 WORD-BY-WORD POP</text>
  </g>
</svg>
