<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14" />
      <stop offset="50%" stop-color="#121626" />
      <stop offset="100%" stop-color="#0d0f1a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="50%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2438" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#131726" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 64px; fill: url(#textGrad); letter-spacing: -1.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 21px; fill: #94A3B8; letter-spacing: 0.2px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #00E5FF; letter-spacing: 1.5px; text-transform: uppercase; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #E2E8F0; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" stroke="#232942" stroke-width="2"/>

  <!-- Background Decorative Shapes / Grid -->
  <g opacity="0.12">
    <circle cx="150" cy="80" r="180" fill="#FF2A85" filter="url(#glow)"/>
    <circle cx="1050" cy="280" r="220" fill="#00E5FF" filter="url(#glow)"/>
    <circle cx="600" cy="180" r="280" fill="#8A2BE2" filter="url(#glow)"/>
  </g>

  <!-- Left: Stylized Mobile 9:16 Phone Mockup -->
  <g transform="translate(100, 45)">
    <!-- Phone Frame -->
    <rect x="0" y="0" width="150" height="270" rx="22" fill="#0b0e17" stroke="#334155" stroke-width="4"/>
    <!-- Screen View -->
    <rect x="6" y="6" width="138" height="258" rx="18" fill="#151b2e"/>
    <!-- Video Content Preview Simulation -->
    <defs>
      <linearGradient id="vidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#312e81"/>
        <stop offset="50%" stop-color="#4c1d95"/>
        <stop offset="100%" stop-color="#831843"/>
      </linearGradient>
    </defs>
    <rect x="10" y="10" width="130" height="250" rx="14" fill="url(#vidGrad)"/>

    <!-- Face Silhouette / Speaker -->
    <circle cx="75" cy="100" r="32" fill="#FBCFE8" opacity="0.9"/>
    <path d="M 35 185 C 35 145, 115 145, 115 185 Z" fill="#F472B6" opacity="0.9"/>

    <!-- Simulated Animated Karaoke Captions -->
    <rect x="22" y="195" width="106" height="24" rx="6" fill="#000000" opacity="0.7"/>
    <text x="75" y="211" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFDF00" text-anchor="middle">MAKE EVERY MOMENT</text>

    <rect x="30" y="223" width="90" height="20" rx="5" fill="#FF2A85" opacity="0.9"/>
    <text x="75" y="237" font-family="sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle">WORTH WATCHING</text>

    <!-- Soundwave & Play Icon -->
    <circle cx="75" cy="50" r="14" fill="#00E5FF" opacity="0.9"/>
    <polygon points="71,44 82,50 71,56" fill="#0B0E17"/>
  </g>

  <!-- Right: Content Area -->
  <g transform="translate(310, 65)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="14" cy="14" r="5" fill="#00E5FF"/>
    <text x="26" y="18" class="badge-text">LOCAL AI VIDEO STUDIO</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title">ViralCut <tspan fill="url(#primaryGrad)">AI</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="122" class="tagline">Turn long-form videos into high-retention 9:16 vertical shorts.</text>
    <text x="0" y="148" class="tagline">Whisper transcription · Gemini intelligence · Word-timed captions · 100% Local.</text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 180)">
      <!-- Badge 1: Gemini -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="15" y="22" class="pill-text">🧠 Gemini Flash-Lite</text>
      </g>
      <!-- Badge 2: Whisper -->
      <g transform="translate(185, 0)">
        <rect width="175" height="36" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="15" y="22" class="pill-text">🎙️ Faster-Whisper VAD</text>
      </g>
      <!-- Badge 3: Turbo Downloader -->
      <g transform="translate(375, 0)">
        <rect width="180" height="36" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="15" y="22" class="pill-text">⚡ Turbo yt-dlp Engine</text>
      </g>
      <!-- Badge 4: Auto 9:16 -->
      <g transform="translate(570, 0)">
        <rect width="180" height="36" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="15" y="22" class="pill-text">📐 OpenCV Smart Crop</text>
      </g>
    </g>
  </g>
</svg>
